# ============================================================================
# AlAqsa — Windows packaging configuration.
#
# Data lives in %AppData%\Roaming\AlAqsa (outside the install directory), so
# uninstalling or installing an update never touches existing client records.
# ============================================================================

appId: com.areenhub.alaqsa
productName: AlAqsa
copyright: © 2026 Areen Abou Fakher. All rights reserved.

directories:
  output: release
  buildResources: build

# Keep this list conservative. Aggressive exclusions previously dropped
# transitive dependencies of pdfmake (call-bind-apply-helpers), which only
# surfaced at runtime as "Cannot find module" when generating a report.
#
# The explicit node_modules entry re-includes packages that electron-builder's
# default heuristics prune; without it the pdfmake dependency chain is
# incomplete in the asar even though it is present in node_modules.
files:
  - dist/**/*
  - package.json
  # Only the native binding is resolved from node_modules at runtime; the rest
  # of the main process (including all of pdfmake's tree) is bundled/copied
  # into dist/ by scripts/build-main.mjs. This removes electron-builder's
  # dependency guessing, which was silently dropping call-bind-apply-helpers
  # and breaking every PDF export in the installed app.
  - node_modules/better-sqlite3-multiple-ciphers/**/*
  - '!**/*.map'

# Arabic fonts are needed at runtime for PDF generation.
extraResources:
  - from: assets/fonts
    to: fonts
    filter: ['**/*.ttf', 'OFL.txt']

asar: true
# Native SQLCipher binding must stay unpacked to be loadable.
asarUnpack:
  - '**/node_modules/better-sqlite3-multiple-ciphers/**'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: AlAqsa-Setup-${version}.${ext}
  # Signing is applied afterwards by scripts/sign-app.ps1 using a certificate
  # generated locally — no paid certificate is required for in-shop use.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AlAqsa
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Never remove the user's data directory on uninstall.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  displayLanguageSelector: false
  installerLanguages:
    - en_US

# Updates install over the previous version and keep %AppData% intact.
publish: null
